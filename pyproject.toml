[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "jsonreshape"
version = "0.1.0"
description = "Viewer, editor and reshaper for huge JSON files (katta JSON fayllar uchun ko'ruvchi, muharrir va tuzilma quruvchi)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Erkin Pardayev", email = "erkin.pardayev@gmail.com" }]
dependencies = [
    "orjson>=3.10",
    "ijson>=3.3",
    "xlsxwriter>=3.2",
    "jmespath>=1.0",
    "psutil>=5.9",
]

[project.urls]
Repository = "https://github.com/Erkinbek/jsonreshape"
Author = "https://github.com/Erkinbek"

[project.optional-dependencies]
gui = ["PySide6>=6.8"]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "openpyxl>=3.1",
    "maturin>=1.9,<2",
    "jsonschema>=4.18",
]
# the Windows .exe (scripts/build_exe.ps1 installs exactly these; the program itself needs none of them)
build = [
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.8",
]

[project.scripts]
jsonreshape = "jsonreshape.cli:main"

[project.gui-scripts]
jsonreshape-gui = "jsonreshape.gui.app:main"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "jsonreshape.core._rscore"
python-source = "."
python-packages = ["jsonreshape"]
exclude = ["jsonreshape/**/__pycache__/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 600
markers = [
    "slow: slow tests (seconds)",
    "bench: big-file benchmark (run with -m bench)",
    "gui: pytest-qt GUI tests",
    "packaging: smoke tests of the PyInstaller build in dist/jsonreshape (skipped without it; scripts/build_exe.ps1)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
