ShortDescription: Viewer, editor and reshaper for huge JSON files
Description: |-
  A desktop application (JSON Reshape) and a command-line tool (jsonreshape) for JSON files from 100 MB to several
  GB: viewing, search, filtering, sorting, conversion (CSV, XLSX, JSON Lines, SQLite), editing with undo and an
  on-disk edit layer, restructuring with a drag-and-drop mapping, statistics, duplicates, JSON Schema, split, merge,
  repair and comparison. A file is never loaded into memory as a whole and the original is never modified. The
  program is offline. The interface is in Uzbek with an English fallback.
